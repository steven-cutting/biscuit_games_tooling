name: CI

on:
  pull_request:
  push:
    # Quoted because a branch named `true`, `false`, `null`, `on`, or `1.0` is
    # valid to Git but is not a string to a YAML 1.1 parser.
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action from this checkout rather than from a pinned commit: a smoke
      # test of the tree under review on every push, in the one repository where
      # a relative path names the right action. No package-lock.json exists
      # here, so npm's cache is off.
      - uses: ./actions/setup-toolchain
        with:
          npm-cache: 'false'
      - run: just sync
      - run: just check
