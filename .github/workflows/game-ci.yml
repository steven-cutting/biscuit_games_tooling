name: Game CI

# Called by every game's ci.yml. Triggers, permissions and concurrency are the
# caller's; the jobs are the same three every game has always run.

on:
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: steven-cutting/biscuit_games_tooling/actions/setup-toolchain@73df4e2309e9ba516b6f9efc0699a3372c87835f # v0.1.0
      - run: just sync
        env:
          # On the step that installs, never on the job: a step with no use for
          # the credential should not carry one. It is the run's own token,
          # minted and discarded with the run, so nothing is stored here.
          NODE_AUTH_TOKEN: ${{ github.token }}
      # No token: the dry run against a complete lockfile reads the registry
      # for nothing, which was checked by running it with no credential in
      # npm's configuration at all, and `uv lock --check` reads no registry.
      - run: just lock-check
      - run: just frontend-static
      - run: just frontend-coverage
      - run: just frontend-build

  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: steven-cutting/biscuit_games_tooling/actions/setup-toolchain@73df4e2309e9ba516b6f9efc0699a3372c87835f # v0.1.0
      # `just lint` runs the whole hook gate, which includes ESLint, the two
      # validators and the two specification gates, so node_modules, the uv
      # environment and the pinned allium binary must all exist.
      - run: just sync
        env:
          # On the step that installs, never on the job: a step with no use for
          # the credential should not carry one. It is the run's own token,
          # minted and discarded with the run, so nothing is stored here.
          NODE_AUTH_TOKEN: ${{ github.token }}
      # Over the network, into the gitignored .tools/bin. No lockfile can name a
      # binary, so `just sync` deliberately does not install it and this does.
      # It is not cached: 1.6 MB downloads faster than a cache round trip.
      - run: just install-allium
      - run: just lint
      - run: just check-docs
      - run: just check-agents
      # Already run by the hook gate above; repeated here so a specification
      # regression names itself in the step list rather than inside `lint`. The
      # same duplication as check-docs and check-agents, for the same reason.
      - run: just check-specs
      - run: just analyse-specs

  # The two story gates need a browser, which no lockfile accounts for, so they
  # get their own job rather than lengthening `frontend` with a download.
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: steven-cutting/biscuit_games_tooling/actions/setup-toolchain@73df4e2309e9ba516b6f9efc0699a3372c87835f # v0.1.0
      # Restored before the install, so a future Playwright that grows an npm
      # install script cannot download ahead of the cache.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: just sync
        env:
          # On the step that installs, never on the job: a step with no use for
          # the credential should not carry one. It is the run's own token,
          # minted and discarded with the run, so nothing is stored here.
          NODE_AUTH_TOKEN: ${{ github.token }}
      # The cache restores the browser binaries but not the apt packages they
      # link against, so the dependency step runs unconditionally.
      - run: just storybook-browsers-deps
      - run: just storybook-browsers
      - run: just storybook-build
      - run: just storybook-test
