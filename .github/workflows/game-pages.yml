name: Game Pages

on:
  workflow_call:
    inputs:
      base_path:
        description: The path Pages serves the site beneath, with a leading slash.
        type: string
        required: true
      artifact_path:
        description: The directory uploaded to Pages.
        type: string
        default: build
      stage:
        description: Run `npm run stage` after the build (a domain-root layout).
        type: boolean
        default: false

# A caller's workflow-level env is not passed to a called workflow, which is
# why the path arrives as an input.
env:
  BASE_PATH: ${{ inputs.base_path }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A job block narrows the calling job's token rather than adding to it,
    # which is what keeps the two publishing scopes on `deploy` and off the job
    # that installs. This one reads the design system package and needs neither.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
          # @steven-cutting/biscuit-games comes from GitHub Packages, which
          # authenticates every request including a read of a public package.
          # This writes a user-level .npmrc under RUNNER_TEMP naming the
          # registry for the scope and reading the token from the environment
          # of each step that installs; the committed .npmrc names the registry
          # and holds nothing, and the checkout the gates prove clean stays that
          # way.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@steven-cutting'
      - run: npm ci --no-audit
        env:
          # On the step that installs, never on the job: a step with no use for
          # the credential should not carry one. It is the run's own token,
          # minted and discarded with the run, so nothing is stored here.
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Build the static site
        run: npm run build
      - name: Stage the domain root around it
        if: inputs.stage
        run: npm run stage
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # The build alone for a project site, which has no domain root to
          # stage around it; static/.nojekyll rides along so Pages serves _app/.
          # A domain-root layout uploads the directory it staged instead.
          path: ${{ inputs.artifact_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Named rather than inherited: a called job holds the calling job's token
    # unless it narrows it, and this one needs the two publishing scopes and not
    # the package read the build holds.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
